[theme]
base = "light"
primaryColor = "#247A38"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F7EF"
textColor = "#182A1C"
borderColor = "#DAE5D6"
greenColor = "#247A38"
greenBackgroundColor = "#E8F5DD"
greenTextColor = "#225B27"
linkColor = "#247A38"
baseRadius = "14px"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
font = "sans-serif"
headingFontSizes = ["42px", "30px", "22px", "18px", "16px", "14px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
dataframeHeaderBackgroundColor = "#EAF2E5"
chartCategoricalColors = ["#247A38", "#83BA3B", "#2B8F86", "#CCA34B", "#617C55", "#9EADB3"]

[theme.sidebar]
backgroundColor = "#F2F7EF"
secondaryBackgroundColor = "#E5EEDC"
textColor = "#182A1C"
primaryColor = "#247A38"

[server]
address = "localhost"
port = 8501
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = "none"
